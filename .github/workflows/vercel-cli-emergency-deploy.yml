name: Vercel CLI Emergency Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: reydas-projects
      VERCEL_PROJECT: musu-deep-nexgen-executives-ar-4dip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Vercel token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::أضف VERCEL_TOKEN إلى GitHub Actions secrets ثم أعد تشغيل هذا المسار."
            exit 2
          fi

      - name: Install and link Vercel CLI
        run: |
          npm install --global vercel@latest
          vercel link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          vercel pull --yes --environment=production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Build and deploy production
        run: |
          vercel build --prod --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" | tee deployment-url.txt
          tail -n 1 deployment-url.txt > deployment-url-clean.txt

      - name: Verify official authentication release
        run: |
          DEPLOYMENT_URL="$(cat deployment-url-clean.txt)"
          vercel curl /api/health --deployment "$DEPLOYMENT_URL" --token "$VERCEL_TOKEN" > health.json
          node -e "const h=require('./health.json'); if(h.release!=='ceo-office-official-team-nine-2026-08-01-v4'||h.directory_version!=='official-team-nine-v4'||h.authorized_users!==9||h.directory?.status!=='ready'){console.error(h);process.exit(1)};console.log(h)"
