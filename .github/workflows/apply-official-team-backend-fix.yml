name: Apply Official Team Backend Fix

on:
  push:
    branches: [security/official-team-directory]
    paths: [.github/workflows/apply-official-team-backend-fix.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/official-team-directory
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patch and validate backend
        run: |
          python scripts/fix_official_team_backend.py
          python -m py_compile backend/server.py backend/arabic_server.py backend/embedded_server.py
          rm scripts/fix_official_team_backend.py

      - name: Commit backend correction
        run: |
          git config user.name "ARAAK Access Automation"
          git config user.email "access-automation@users.noreply.github.com"
          git add backend/server.py scripts/fix_official_team_backend.py
          git diff --cached --check
          git commit -m "تصحيح تهيئة ملاك المشروعات وصلاحيات الاعتماد"
          git push origin HEAD:security/official-team-directory
