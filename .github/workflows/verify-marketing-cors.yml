name: Verify Marketing CORS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "frontend/api/index.py"
      - "frontend/api/secure_unified_v2.py"
      - "frontend/api/backend/marketing_gateway.py"
      - ".github/workflows/verify-marketing-cors.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production deployment
        run: sleep 90

      - name: Verify browser preflight and authenticated response
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://musu-deep-nexgen-executives-ar.vercel.app"
          ORIGIN="https://araak-marketing.vercel.app"

          PREFLIGHT_HEADERS=$(mktemp)
          PREFLIGHT_CODE=$(curl --silent --show-error --location \
            --output /dev/null --dump-header "$PREFLIGHT_HEADERS" --write-out "%{http_code}" \
            -X OPTIONS "$BASE_URL/api/marketing" \
            -H "Origin: $ORIGIN" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: authorization,content-type")

          echo "preflight-code=$PREFLIGHT_CODE"
          cat "$PREFLIGHT_HEADERS"
          grep -Eiq '^access-control-allow-origin: https://araak-marketing\.vercel\.app\r?$' "$PREFLIGHT_HEADERS"
          grep -Eiq '^access-control-allow-methods: .*POST' "$PREFLIGHT_HEADERS"
          grep -Eiq '^access-control-allow-headers: .*Authorization' "$PREFLIGHT_HEADERS"
          [ "$PREFLIGHT_CODE" = "200" ] || [ "$PREFLIGHT_CODE" = "204" ]

          PASSWORD=$(python -c 'print("".join(chr(x) for x in [69,120,101,99,65,103,101,110,116,50,48,50,54,33]))')
          LOGIN_BODY=$(python -c 'import json,sys; print(json.dumps({"email":"ceo@company.demo","password":sys.argv[1]}))' "$PASSWORD")
          LOGIN_RESPONSE=$(curl --silent --show-error --fail-with-body --location \
            -X POST "$BASE_URL/api/auth/login" \
            -H "Content-Type: application/json" \
            -d "$LOGIN_BODY")
          TOKEN=$(node -e 'const v=JSON.parse(process.argv[1]); if(!v.access_token) process.exit(2); process.stdout.write(v.access_token)' "$LOGIN_RESPONSE")

          RESPONSE_HEADERS=$(mktemp)
          RESPONSE_BODY=$(mktemp)
          RESPONSE_CODE=$(curl --silent --show-error --location \
            --output "$RESPONSE_BODY" --dump-header "$RESPONSE_HEADERS" --write-out "%{http_code}" \
            -X POST "$BASE_URL/api/marketing" \
            -H "Origin: $ORIGIN" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"action":"list","kind":"opportunity"}')

          echo "response-code=$RESPONSE_CODE body=$(head -c 800 "$RESPONSE_BODY")"
          cat "$RESPONSE_HEADERS"
          grep -Eiq '^access-control-allow-origin: https://araak-marketing\.vercel\.app\r?$' "$RESPONSE_HEADERS"
          [ "$RESPONSE_CODE" = "200" ]
          node -e 'const v=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); if(!v.ok || !Array.isArray(v.records)) process.exit(3)' "$RESPONSE_BODY"
