name: Vercel Full Stack Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify production release and optional private login
        env:
          BASE_URL: https://musu-deep-nexgen-executives-ar-4dip.vercel.app
          EXPECTED_RELEASE: ceo-office-official-team-nine-2026-08-01-v4
          SMOKE_CEO_EMAIL: ${{ secrets.SMOKE_CEO_EMAIL }}
          SMOKE_CEO_PASSWORD: ${{ secrets.SMOKE_CEO_PASSWORD }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          base = os.environ["BASE_URL"].rstrip("/")
          expected_release = os.environ["EXPECTED_RELEASE"]
          last_error = "not started"
          for attempt in range(90):
              try:
                  request = urllib.request.Request(
                      base + "/api/health",
                      headers={"User-Agent": "ARAAK-Vercel-Smoke/4.0"},
                  )
                  with urllib.request.urlopen(request, timeout=20) as response:
                      health = json.loads(response.read().decode("utf-8"))
                  assert health.get("status") == "ready", health
                  assert health.get("release") == expected_release, health
                  assert health.get("directory_version") == "official-team-nine-v4", health
                  assert health.get("authorized_users") == 9, health
                  assert health.get("directory", {}).get("status") == "ready", health
                  print("Production release ready on attempt", attempt + 1, health["release"])
                  break
              except Exception as exc:
                  last_error = repr(exc)
                  print("Waiting for production release:", last_error)
                  time.sleep(10)
          else:
              raise SystemExit("Production release did not become ready: " + last_error)

          email = os.environ.get("SMOKE_CEO_EMAIL", "").strip()
          password = os.environ.get("SMOKE_CEO_PASSWORD", "")
          if not email or not password:
              print("Private login smoke skipped: repository secrets are not configured.")
              raise SystemExit(0)

          payload = json.dumps({"email": email, "password": password}).encode("utf-8")
          login_request = urllib.request.Request(
              base + "/api/auth/login",
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "ARAAK-Vercel-Smoke/4.0",
              },
          )
          with urllib.request.urlopen(login_request, timeout=30) as response:
              login = json.loads(response.read().decode("utf-8"))
          token = login["access_token"]
          assert login["user"]["role"] == "ceo"
          assert login.get("directory_version") == "official-team-nine-v4"

          me_request = urllib.request.Request(
              base + "/api/auth/me",
              headers={
                  "Authorization": "Bearer " + token,
                  "User-Agent": "ARAAK-Vercel-Smoke/4.0",
              },
          )
          with urllib.request.urlopen(me_request, timeout=30) as response:
              me = json.loads(response.read().decode("utf-8"))
          assert me["user"]["role"] == "ceo"
          print("Production private login and auth/me passed")
          PY
