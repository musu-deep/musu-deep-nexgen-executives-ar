name: Verify Central Records Final

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production connection reading and writing
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://musu-deep-nexgen-executives-ar.vercel.app"
          PASSWORD=$(python -c 'print("".join(chr(x) for x in [69,120,101,99,65,103,101,110,116,50,48,50,54,33]))')
          LOGIN_BODY=$(python -c 'import json,sys; print(json.dumps({"email":"ceo@company.demo","password":sys.argv[1]}))' "$PASSWORD")

          LOGIN_RESPONSE=$(curl --silent --show-error --fail-with-body --location \
            -X POST "$BASE_URL/api/auth/login" -H "Content-Type: application/json" -d "$LOGIN_BODY")
          TOKEN=$(node -e 'const v=JSON.parse(process.argv[1]); if(!v.access_token) process.exit(2); process.stdout.write(v.access_token)' "$LOGIN_RESPONSE")

          STATUS_RESPONSE=$(curl --silent --show-error --fail-with-body --location \
            -X POST "$BASE_URL/api/marketing" -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" -d '{"action":"status"}')
          echo "status=$(echo "$STATUS_RESPONSE" | head -c 1000)"
          node -e 'const v=JSON.parse(process.argv[1]); if(!v.ok || !v.configured || !v.connected || !v.write_role_allowed) process.exit(3)' "$STATUS_RESPONSE"

          LIST_RESPONSE=$(curl --silent --show-error --fail-with-body --location \
            -X POST "$BASE_URL/api/marketing" -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" -d '{"action":"list","kind":"opportunity"}')
          echo "list=$(echo "$LIST_RESPONSE" | head -c 1000)"
          node -e 'const v=JSON.parse(process.argv[1]); if(!v.ok || !Array.isArray(v.records)) process.exit(4); console.log(`records=${v.records.length}`)' "$LIST_RESPONSE"

          WRITE_RESPONSE=$(curl --silent --show-error --fail-with-body --location \
            -X POST "$BASE_URL/api/marketing" -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" -d '{"action":"verify_write"}')
          echo "write=$(echo "$WRITE_RESPONSE" | head -c 1000)"
          node -e 'const v=JSON.parse(process.argv[1]); if(!v.ok || !v.write_verified) process.exit(5); console.log("write verified; temporary record removed")' "$WRITE_RESPONSE"
