name: Authorized Access Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check server modules
        run: |
          node --check lib/araak-password-directory.js
          node --check lib/authorized-access.js
          node --check api/staff-login.js
          node --check api/staff-me.js
          node --check api/users.js
          node --check api/auth/change-password.js
          node --check 'api/[...path].js'
          node --check scripts/test_team_permissions.mjs

      - name: Verify official team permissions
        run: node scripts/test_team_permissions.mjs

      - name: Install frontend dependencies
        run: npm --prefix frontend install --legacy-peer-deps

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Run credential-safe IAM checks
        run: node scripts/test_vercel_iam.mjs
