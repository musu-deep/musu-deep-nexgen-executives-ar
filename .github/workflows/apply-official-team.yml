name: Apply Official Team Directory

on:
  push:
    branches: [security/official-team-directory]
    paths: [.github/workflows/apply-official-team.yml]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/official-team-directory
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply official team directory and permissions
        run: python scripts/apply_official_team.py

      - name: Validate migrated sources
        run: |
          python -m py_compile backend/server.py backend/arabic_server.py backend/embedded_server.py
          node --check lib/araak-password-directory.js
          node --check lib/authorized-access.js
          node --check 'api/[...path].js'
          node --check scripts/test_vercel_iam.mjs
          node --check scripts/test_team_permissions.mjs
          node scripts/test_team_permissions.mjs
          npm --prefix frontend ci --legacy-peer-deps
          npm --prefix frontend run build

      - name: Commit migrated sources
        run: |
          git config user.name "ARAAK Access Automation"
          git config user.email "access-automation@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "تحديث دليل الفريق الرسمي وصلاحيات محمود عوض"
          git push origin HEAD:security/official-team-directory
