name: Validate Vercel IAM

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate sanitized authentication sources
        run: |
          node --check lib/araak-password-directory.js
          node --check lib/araak-password-directory-v5.js
          node --check lib/authorized-access.js
          node --check lib/araak-iam.js
          node --check lib/araak-iam-http.js
          node --check api/staff-login.js
          node --check api/staff-me.js
          node --check api/users.js
          node --check api/auth/change-password.js
          node --check 'api/[...path].js'
          node --check frontend/api/v4.js
          node --check scripts/test_vercel_iam.mjs
          node --check scripts/test_team_permissions.mjs
          node --check scripts/test_odoo_attachment_directory.mjs
          python -m py_compile backend/server.py backend/arabic_server.py backend/embedded_server.py
          ! grep -R -E 'ExecAgent2026!|@company\.demo' .github api backend frontend lib scripts
          node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8')); JSON.parse(require('fs').readFileSync('frontend/vercel.json','utf8')); console.log('Vercel configs valid')"

      - name: Exercise credential-safe IAM routes
        run: node scripts/test_vercel_iam.mjs

      - name: Verify official team permissions
        run: node scripts/test_team_permissions.mjs

      - name: Verify Odoo attachment directory
        run: node scripts/test_odoo_attachment_directory.mjs

      - name: Build frontend
        run: |
          npm --prefix frontend ci --legacy-peer-deps
          npm --prefix frontend run build
