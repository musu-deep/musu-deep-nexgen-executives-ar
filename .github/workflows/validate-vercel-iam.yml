name: Validate Vercel IAM

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sanitize-legacy-auth:
    if: github.event_name == 'pull_request' && github.head_ref == 'security/authorized-users-only'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/authorized-users-only
          fetch-depth: 0

      - name: Apply deterministic source sanitizer
        run: python .github/scripts/sanitize_auth_sources.py

      - name: Commit sanitized sources when needed
        run: |
          git config user.name "ARAAK Security Automation"
          git config user.email "security-automation@users.noreply.github.com"
          git add api/'[...path].js' backend/server.py backend/arabic_server.py .github/workflows/arabic-version-ci.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Legacy sources already sanitized."
          else
            git commit -m "Sanitize remaining legacy authentication sources"
            git push origin HEAD:security/authorized-users-only
          fi

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate serverless JavaScript
        run: |
          node --check lib/araak-password-directory.js
          node --check lib/authorized-access.js
          node --check lib/araak-iam.js
          node --check lib/araak-iam-http.js
          node --check api/staff-login.js
          node --check api/staff-me.js
          node --check api/users.js
          node --check api/auth/change-password.js
          node --check scripts/test_vercel_iam.mjs
          node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8')); console.log('vercel.json valid')"

      - name: Exercise credential-safe IAM routes
        run: node scripts/test_vercel_iam.mjs

      - name: Build frontend
        run: |
          npm --prefix frontend ci --legacy-peer-deps
          npm --prefix frontend run build
