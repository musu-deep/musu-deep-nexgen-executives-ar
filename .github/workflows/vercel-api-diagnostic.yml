name: Vercel API Diagnostic

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect production Vercel API routes
        run: |
          set -x
          curl --fail-with-body --show-error --location --max-time 30 \
            https://musu-deep-nexgen-executives-ar.vercel.app/api/health
