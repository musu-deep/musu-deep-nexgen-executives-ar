name: Verify Marketing Browser Preflight

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production deployment
        run: sleep 90

      - name: Verify ARAAK Marketing browser preflight
        shell: bash
        run: |
          set -euo pipefail
          HEADERS=$(mktemp)
          CODE=$(curl --silent --show-error --location \
            --output /dev/null --dump-header "$HEADERS" --write-out "%{http_code}" \
            -X OPTIONS "https://musu-deep-nexgen-executives-ar.vercel.app/api/marketing" \
            -H "Origin: https://araak-marketing.vercel.app" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: authorization,content-type")

          echo "preflight-code=$CODE"
          cat "$HEADERS"
          [ "$CODE" = "200" ] || [ "$CODE" = "204" ]
          grep -Eiq '^access-control-allow-origin: https://araak-marketing\.vercel\.app\r?$' "$HEADERS"
          grep -Eiq '^access-control-allow-methods: .*POST' "$HEADERS"
          grep -Eiq '^access-control-allow-headers: .*Authorization' "$HEADERS"
